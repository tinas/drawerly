name: 🐛 Bug Report
description: Report a reproducible bug in Drawerly.
title: '[Bug]: '
labels: [bug, pending triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! A minimal reproduction is required — issues without one may be closed.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Reproduction link
      description: |
        A link to a minimal reproduction (StackBlitz, CodeSandbox, or a small GitHub repo). Reproductions on the exact affected version make triage much faster.
      placeholder: https://stackblitz.com/edit/...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do to trigger the bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include console errors or screenshots if relevant.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `npx envinfo --system --binaries --browsers --npmPackages '{@drawerly/*,vue,react,react-dom}'` (or fill it out manually).
      render: text
      placeholder: |
        System:
          OS: macOS 15.0
        Binaries:
          Node: 22.11.0
        Browsers:
          Chrome: 130.0.0
        npmPackages:
          @drawerly/core: ^0.2.0
          @drawerly/vue: ^0.2.0
          vue: ^3.5.0
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else worth noting — related issues, workarounds, ideas for a fix.
